<div class="form-container">
  <h2>Créer un nouveau Kitsune</h2>

  <form [formRoot]="form">
    <div class="form-group">
      <label>Nom :</label>
      @if (form.nom().dirty() && form.nom().invalid()) {
        <ul>
            @for (error of form.nom().errors(); track error) {
                <li>{{error.message}}</li>
            }
        </ul>
      }
      <input type="text" [formField]="form.nom" >
    </div>

    <div class="form-group">
      <label>Description :</label>
      <input type="text" [formField]="form.description">
    </div>

    <div class="form-group">
      <label>Points de vie (PV) :</label>
      <input type="number" [formField]="form.pv">
    </div>

    <div class="form-group">
      <label>Force :</label>
      <input type="number" [formField]="form.force">
    </div>

    <div class="form-group">
      <label>Vitesse :</label>
      <input type="number" [formField]="form.vitesse">
    </div>

    <button type="submit" class="btn-submit">Créer le Kitsune</button>
  </form>
</div>
